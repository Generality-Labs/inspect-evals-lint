# Built and deployed by .github/workflows/docs.yml. docs/rules/ is generated by
# `python -m inspect_evals_lint.docs`; the front page, the rule index, llms.txt,
# llms-full.txt and rules.json are added at build time by mkdocs_hooks.py. The
# nav is derived from the files, so a new rule page appears without editing this
# file.
site_name: inspect-evals-lint
site_description: Static checks for Inspect AI evaluations
site_url: https://inspect-evals-lint.generality.org/
repo_url: https://github.com/Generality-Labs/inspect-evals-lint
repo_name: Generality-Labs/inspect-evals-lint
edit_uri: ""
docs_dir: docs
strict: true
# The hooks build the front page and the rule index from these, so `mkdocs
# serve` rebuilds when they change.
watch:
  - README.md
  - src/inspect_evals_lint

# Adds the pages that list every rule, and copies each page's Markdown source
# into the site next to its HTML, for agents.
hooks:
  - mkdocs_hooks.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  # Follows the reader's system light/dark setting; the toggle overrides it
  # and remembers the choice.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
