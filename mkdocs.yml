# Built and deployed by .github/workflows/docs.yml. docs/index.md, docs/CHECKS.md
# and docs/rules/ are generated by `python -m inspect_evals_lint.docs`. The nav is
# derived from the files, so a new rule page appears without editing this file.
site_name: inspect-evals-lint
site_description: Static checks for Inspect AI evaluations
site_url: https://inspect-evals-lint.generality.org/
repo_url: https://github.com/Generality-Labs/inspect-evals-lint
repo_name: Generality-Labs/inspect-evals-lint
edit_uri: ""
docs_dir: docs
strict: true

# Copies each page's Markdown source into the site next to its HTML, for agents.
hooks:
  - mkdocs_hooks.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
