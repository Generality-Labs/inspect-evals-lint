[build-system]
# uv's own backend. It builds src/inspect_evals_lint/ with no further config.
# Keep the upper bound at the next uv minor, as `uv init` writes it, and raise
# both bounds when moving to a new uv minor.
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[project]
name = "inspect-evals-lint"
version = "0.11.0"
description = "Static checks for Inspect AI evaluations: structure, tests, best practices and sandbox pinning"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"] # uv_build ships only the license files named here
authors = [{ name = "Matt Fisher", email = "m@ttfisher.com" }]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
inspect-evals-lint = "inspect_evals_lint.cli:main"

[project.urls]
Homepage = "https://github.com/Generality-Labs/inspect-evals-lint"
Repository = "https://github.com/Generality-Labs/inspect-evals-lint"
Issues = "https://github.com/Generality-Labs/inspect-evals-lint/issues"
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
    "basedpyright>=1.39",
    "pre-commit>=4.0.0",
    "scriv>=1.8",
    "types-PyYAML",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    # The ruff_rules_enabled tests run the real ruff. Same version as the
    # ruff-pre-commit hook, so `uv run ruff` and pre-commit agree.
    "ruff==0.15.20",
]
docs = [
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "mkdocs-material>=9.5",
]


[tool.scriv]
# One fragment per pull request in changelog.d/, collected into CHANGELOG.md
# at release time, so concurrent PRs never edit the same lines of the changelog.
format = "md"
fragment_directory = "changelog.d"
categories = ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security"]
skip_fragments = "[A-Z]*" # TEMPLATE.md
new_fragment_template = "file: TEMPLATE.md"
entry_title_template = "[{{ version }}] - {{ date.strftime('%Y-%m-%d') }}"
md_header_level = "2"
md_html_anchors = false
# Without this, two fragments in one category leave a blank line between them,
# which makes the list loose and fails mdformat on the release commit.
compact_fragments = true
# The version's single source is [project] version above, which
# `uv version --bump` (and the Prepare release workflow) rewrites.
version = "literal: pyproject.toml: project.version"

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "D",     # pydocstyle
    "C4",    # flake8-comprehensions
    "PT",    # flake8-pytest-style
    "PIE",   # flake8-pie
    "DTZ",   # flake8-datetimez (timezone-aware datetimes)
    "ISC",   # implicit-str-concat (catches missing commas)
    "ASYNC", # flake8-async
    "N",     # pep8-naming
    "FURB",  # refurb (modernization)
    "RUF",   # ruff-specific rules
    "PLE",   # pylint errors
    "PLW",   # pylint warnings
]
ignore = [
    "E501",   # line-too-long — the formatter owns line length
    "D10",    # missing docstrings — don't force them
    "D415",   # first-line punctuation — the module docstring is the project
    # description, whose punctuation varies
    "ISC001", # single-line implicit concat — conflicts with the formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"] # tests don't need docstring linting

[tool.basedpyright]
pythonVersion = "3.11"
# "strict" (pyright's), not basedpyright's stricter default "recommended" —
# the based-only rules (reportAny etc.) are opt-in per project.
typeCheckingMode = "strict"
reportMissingTypeStubs = false # third-party libs are often untyped

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rA --durations=10 --color=yes --cov=src --cov-report=term-missing"

[tool.typos.default.extend-words]
# Import name of the odfpy package, not a misspelling of "of".
odf = "odf"
# os.spawnve, one of the process sinks host_code_execution checks.
spawnve = "spawnve"
